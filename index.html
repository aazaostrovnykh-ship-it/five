<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сайт-визитка за 5 минут!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rubik', sans-serif;
            background: radial-gradient(circle at top left, #ff6b6b, #feca57, #48dbfb, #1dd1a1, #5f27cd);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            padding: 20px;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }
        .card {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 4px rgba(255, 255, 255, 0.2) inset;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: scale(1.01); }
        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.8rem;
            color: #fff;
            text-shadow: 4px 4px 0 #ff9f43, 8px 8px 0 rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff7e6;
            text-shadow: 2px 2px 0 #e17055;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .subtitle span {
            background: #fd79a8;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 1.6rem;
            box-shadow: 0 4px 0 #6c5ce7;
            transform: rotate(-2deg);
        }
        .timer-wrapper {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 100px;
            padding: 20px 30px;
            margin: 20px 0 35px;
            display: inline-block;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.2);
        }
        #timer {
            font-family: 'Fredoka One', cursive;
            font-size: 5rem;
            color: #ffeaa7;
            text-shadow: 0 0 20px #fdcb6e, 0 0 40px #e17055, 0 0 60px #d63031;
            letter-spacing: 8px;
            line-height: 1.2;
        }
        .emoji-big {
            font-size: 4rem;
            display: inline-block;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .progress-bar {
            width: 100%;
            height: 16px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            margin: 25px 0 30px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        #progressFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f9ca24, #f0932b, #eb4d4b);
            border-radius: 20px;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px #f0932b;
        }
        .status-message {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 25px;
            border-radius: 60px;
            display: inline-block;
            margin-bottom: 25px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 0 #2d3436;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn {
            font-family: 'Fredoka One', cursive;
            font-size: 1.6rem;
            padding: 18px 40px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            color: #fff;
            background: #6c5ce7;
            box-shadow: 0 8px 0 #3d3d3d, 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #3d3d3d;
        }
        .btn-reset {
            background: #fd79a8;
            box-shadow: 0 8px 0 #6c5ce7;
        }
        .btn-reset:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #6c5ce7;
        }
        .stats-block {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 40px;
            padding: 20px 15px;
            backdrop-filter: blur(4px);
        }
        .stats-block p {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            font-size: 1.3rem;
            color: #ffeaa7;
        }

            font-size: 1.8rem;
            color: #fff;
            background: rgba
