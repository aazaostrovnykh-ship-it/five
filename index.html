        .modal-box .skip-link {

        }

        .modal-box .status-msg {

        }

        /* ---------- АДАПТИВНОСТЬ ---------- */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .subtitle { font-size: 0.8rem; gap: 10px; }
            #timer { font-size: 3.2rem; letter-spacing: 4px; }
            .btn { font-size: 0.9rem; padding: 12px 20px; }

        .pixel-star {
            display: inline-block;

        @keyframes spinStar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

<body>

    <!-- Контейнер для искр -->

    <div class="card">

        </div>

        <div class="timer-wrapper">
            <div id="timer">5:00</div>
        </div>

        <div class="progress-bar">
            <div id="progressFill" style="width: 100%;"></div>
        </div>

        <div class="status-message" id="statusMessage">
            ⏳ НАЖМИ СТАРТ
        </div>

        <div class="btn-group">

        <!-- Блок статистики + контакты -->
        <div class="stats-block">

        <!-- Пиксельные украшения -->
        <div style="margin-top: 25px; font-size: 2.2rem; color: #4a6a8f; letter-spacing: 12px;">
            <span class="pixel-star">✦</span>

    <!-- ============================================================
         ОСНОВНОЙ СКРИПТ (таймер, счётчики, контакты, Formspree)
         ============================================================ -->
    <script>
        (function() {
            // === Элементы ===
            const timerDisplay = document.getElementById('timer');
            const progressFill = document.getElementById('progressFill');
            const statusMessage = document.getElementById('statusMessage');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const sparkContainer = document.getElementById('sparkContainer');

            // Модалка и поля
            const modal = document.getElementById('contactModal');
            const userNameInput = document.getElementById('userName');
            const userEmailInput = document.getElementById('userEmail');
            const saveContactBtn = document.getElementById('saveContactBtn');
            const skipContactBtn = document.getElementById('skipContactBtn');
            const formStatus = document.getElementById('formStatus');
            const displayName = document.getElementById('displayName');
            const displayEmail = document.getElementById('displayEmail');

            // === Контакты из localStorage ===
            let userContact = {
                name: localStorage.getItem('userName') || '',
                email: localStorage.getItem('userEmail') || ''
            };

            // === Счётчики кликов ===
            let startCount = parseInt(localStorage.getItem('startClicks_pixel') || '0');
            let resetCount = parseInt(localStorage.getItem('resetClicks_pixel') || '0');

            // === Таймер ===
            const TOTAL_SECONDS = 5 * 60;
            let timeLeft = TOTAL_SECONDS;
            let timerInterval = null;
            let isRunning = false;
            let isFinished = false;

            // === Обновление UI контактов ===
            function updateContactUI() {
                displayName.textContent = userContact.name || '—';
                displayEmail.textContent = userContact.email || '—';
            }

            // === Обновление статистики ===
            function updateStatsUI() {
                document.getElementById('startClicks').textContent = startCount;
                document.getElementById('resetClicks').textContent = resetCount;
                document.getElementById('totalClicks').textContent = startCount + resetCount;
                localStorage.setItem('startClicks_pixel', startCount);
                localStorage.setItem('resetClicks_pixel', resetCount);
            }

            // === Форматирование времени ===
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            // === Обновление дисплея ===
            function updateDisplay() {
                timerDisplay.textContent = formatTime(timeLeft);
                const progress = (timeLeft / TOTAL_SECONDS) * 100;
                progressFill.style.width = `${progress}%`;

                if (timeLeft <= 30) {
                    timerDisplay.style.color = '#ff6b6b';
                    timerDisplay.style.textShadow = '0 0 20px #ff6b6b, 0 0 40px #ff4757';
                } else if (timeLeft <= 60) {
                    timerDisplay.style.color = '#f7d44a';
                    timerDisplay.style.textShadow = '0 0 20px #f7d44a, 0 0 40px #b8860b';
                } else {
                    timerDisplay.style.color = '#7bed9f';
                    timerDisplay.style.textShadow = '0 0 20px #2ed573, 0 0 40px #2ed573';
                }

                if (timeLeft === 0) {
                    statusMessage.textContent = '🎉 ГОТОВО! САЙТ СОЗДАН! 🎉';
                    statusMessage.style.background = '#2ed573';
                    statusMessage.style.borderColor = '#1a7a3a';
                    statusMessage.style.color = '#0b0e1a';
                    isFinished = true;
                    if (isRunning) {
                        stopTimer();
                        launchSparks();
                    }
                } else {
                    statusMessage.textContent = `⏳ ОСТАЛОСЬ ${formatTime(timeLeft)}`;
                    statusMessage.style.background = '#0b0e1a';
                    statusMessage.style.borderColor = '#4a6a8f';
                    statusMessage.style.color = '#b8d4f0';
                    isFinished = false;
                }
            }

            // === Управление таймером ===
            function startTimer() {
                if (isRunning) return;
                if (timeLeft === 0) {
                    resetTimer();
                }
                isRunning = true;
                isFinished = false;
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        stopTimer();
                        updateDisplay();
                        launchSparks();
                    }
                }, 1000);
                startBtn.textContent = '⏸ ПАУЗА';
                startBtn.style.background = '#f7d44a';
                startBtn.style.boxShadow = '0 8px 0 #b8860b, 0 0 0 4px #0b0e1a';
                statusMessage.textContent = '⏳ ВРЕМЯ ПОШЛО!';
            }

            function stopTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                startBtn.textContent = '▶ ПРОДОЛЖИТЬ';
                startBtn.style.background = '#2ed573';
                startBtn.style.boxShadow = '0 8px 0 #1a7a3a, 0 0 0 4px #0b0e1a';
            }

            function resetTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                isFinished = false;
                timeLeft = TOTAL_SECONDS;
                updateDisplay();
                startBtn.textContent = '▶ СТАРТ';
                startBtn.style.background = '#2ed573';
                startBtn.style.boxShadow = '0 8px 0 #1a7a3a, 0 0 0 4px #0b0e1a';
                statusMessage.textContent = '🔄 СБРОС. НАЖМИ "СТАРТ"!';
                statusMessage.style.background = '#0b0e1a';
                statusMessage.style.borderColor = '#4a6a8f';
                statusMessage.style.color = '#b8d4f0';
                sparkContainer.innerHTML = '';
            }

            // === ПИКСЕЛЬНЫЕ ИСКРЫ ===
            function launchSparks() {
                const colors = ['#f7d44a', '#ff6b6b', '#4a6a8f', '#2ed573', '#b8860b', '#a29bfe', '#fd79a8'];
                const container = sparkContainer;
                container.innerHTML = '';
                for (let i = 0; i < 100; i++) {
                    const spark = document.createElement('div');
                    spark.className = 'spark';
                    const size = Math.floor(Math.random() * 12) + 6;
                    spark.style.width = size + 'px';
                    spark.style.height = size + 'px';
                    spark.style.background = colors[Math.floor(Math.random() * colors.length)];
                    spark.style.left = Math.random() * 100 + '%';
                    spark.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    spark.style.animationDelay = (Math.random() * 2) + 's';
                    spark.style.border = '2px solid #0b0e1a';
                    container.appendChild(spark);
                }
                setTimeout(() => { container.innerHTML = ''; }, 5000);
            }

            // === ОТПРАВКА КОНТАКТОВ НА FORMPREE (ваш endpoint) ===
            async function sendContactToFormspree(name, email) {
                const endpoint = 'https://formspree.io/f/mzebpawq';
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ name, email })
                    });
                    if (response.ok) {
                        formStatus.textContent = '✅ Отправлено! Спасибо!';
                        formStatus.style.color = '#2ed573';
                    } else {
                        formStatus.textContent = '❌ Ошибка отправки, попробуйте позже';
                        formStatus.style.color = '#ff6b6b';
                    }
                } catch (error) {
                    formStatus.textContent = '❌ Ошибка соединения';
                    formStatus.style.color = '#ff6b6b';
                }
            }

            // === ОБРАБОТКА МОДАЛКИ ===
            function showModal() {
                modal.classList.add('active');
                if (userContact.name) userNameInput.value = userContact.name;
                if (userContact.email) userEmailInput.value = userContact.email;
                formStatus.textContent = '';
            }

            function hideModal() {
                modal.classList.remove('active');
            }

            function saveContact() {
                const name = userNameInput.value.trim();
                const email = userEmailInput.value.trim();
                if (!name && !email) {
                    formStatus.textContent = '⚠️ Введите хотя бы имя';
                    formStatus.style.color = '#f7d44a';
                    return;
                }
                // Сохраняем в localStorage
                if (name) localStorage.setItem('userName', name);
                if (email) localStorage.setItem('userEmail', email);
                userContact.name = name || '';
                userContact.email = email || '';
                updateContactUI();
                // Отправляем на Formspree
                sendContactToFormspree(name, email);
                // Отправляем событие в Метрику
                ym(112002680, 'reachGoal', 'CONTACT_SAVED', { name: name, email: email });
                // Закрываем модалку через 1 секунду (чтобы пользователь увидел статус)
                setTimeout(() => {
                    hideModal();
                    // Запускаем таймер, если он не запущен
                    if (!isRunning && timeLeft > 0) {
                        startTimer();
                    } else if (timeLeft === 0) {
                        resetTimer();
                        startTimer();
                    }
                }, 1000);
            }

            // === Обработчики модалки ===
            saveContactBtn.addEventListener('click', saveContact);
            skipContactBtn.addEventListener('click', function() {
                hideModal();
                // Запускаем таймер без контактов
                if (!isRunning && timeLeft > 0) {
                    startTimer();
                } else if (timeLeft === 0) {
                    resetTimer();
                    startTimer();
                }
            });

            // === Обработчик кнопки СТАРТ ===
            startBtn.addEventListener('click', function(e) {
                // Если контакты не введены и модалка не активна – показываем модалку
                if (!userContact.name && !userContact.email && !modal.classList.contains('active')) {
                    showModal();
                    return;
                }
                if (modal.classList.contains('active')) return;

                // Если контакты уже есть – управляем таймером
                if (!isRunning) {
                    startCount++;
                    updateStatsUI();
                    ym(112002680, 'reachGoal', 'START_CLICK', { name: userContact.name, email: userContact.email });
                }

                if (isRunning) {
                    stopTimer();
                    statusMessage.textContent = '⏸ ПАУЗА. НАЖМИ "ПРОДОЛЖИТЬ"';
                } else {
                    if (timeLeft === 0) {
                        resetTimer();
                        startTimer();
                    } else {
                        startTimer();
                    }
                }
            });

            // === Обработчик кнопки СБРОС ===
            resetBtn.addEventListener('click', function() {
                resetCount++;
                updateStatsUI();
                ym(112002680, 'reachGoal', 'RESET_CLICK', { name: userContact.name, email: userContact.email });
                resetTimer();
            });

            // === Инициализация ===
            updateDisplay();
            updateStatsUI();
            updateContactUI();
            statusMessage.textContent = '🕹️ ГОТОВ? НАЖМИ "СТАРТ"!';
            setTimeout(launchSparks, 400);

            // Если контактов нет – через 3 секунды показываем модалку
            if (!userContact.name && !userContact.email) {
                setTimeout(() => {
                    if (!userContact.name && !userContact.email) {
                        showModal();
                    }
                }, 3000);
            }
        })();
    </script>
</body>
</html>
